# The real-feed card with location control: Filters > Area can switch the one place the server discovers events for.
# Needs the scripts from homeassistant/location_control.example.yaml (see docs/location-control.md).
type: custom:area-events-card
title: Area Events
feed: /local/area-events-card/events.json
location_control: true
country: US
radius_miles: 25
