[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "area-events"
version = "0.2.0"
description = "Local event discovery service and Home Assistant integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["goose3==3.1.22"]

[project.scripts]
area-events = "area_events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["area_events*"]
