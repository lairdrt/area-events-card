name: Area Events CI

on:
  push:
    branches: [main, ha-native-refactor]
  pull_request:
    branches: [main, ha-native-refactor]

permissions:
  contents: read

jobs:
  ci:
    name: tests-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the application package
        run: python -m pip install --no-deps .
      - name: Run Python tests
        run: python -m unittest discover -s tests -t .
      - name: Check resumable deployment decisions and PowerShell syntax
        shell: pwsh
        run: ./scripts/test-deployment-resume.ps1
      - name: Validate frontend build
        run: npm run build
      - name: Run JavaScript tests
        run: npm test
