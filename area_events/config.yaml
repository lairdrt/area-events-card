name: Area Events
version: "0.2.0"
slug: area_events
description: Finds local events for the Area Events integration and its dashboard cards
url: https://github.com/lairdrt/area-events-card
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
watchdog: "http://[HOST]:[PORT:8765]/health"
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Engine API (not needed; Home Assistant reaches the app by its hostname)
options:
  token: ""
  refresh_minutes: 60
  log_level: info
schema:
  token: password
  refresh_minutes: int(15,1440)
  log_level: list(debug|info|warning|error)
