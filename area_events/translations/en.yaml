configuration:
  token:
    name: Token (optional)
    description: Leave empty. The app creates a token itself and hands it to Home Assistant. Only set one (32 or more characters) if you connect the integration by hand.
  refresh_minutes:
    name: Refresh interval (minutes)
    description: How often each area's events are rediscovered. Areas nobody has asked for recently are not refreshed.
  log_level:
    name: Log level
    description: How much the app writes to its log.
