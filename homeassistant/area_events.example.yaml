# Home Assistant side of multi-area discovery: scripts the Area Events Card calls with the signed-in user's own
# session. Each script validates its input and forwards it, with the server's API key, to the discovery service.
# The key lives only in secrets.yaml; it never reaches a card, a dashboard or a browser.
#
# 1. secrets.yaml (use your own key; at least 32 random characters, the same value the service is started with):
#      area_events_authorization: "Bearer <your key>"
# 2. Add the `rest_command:` block below to configuration.yaml (merge with an existing one) and change the address.
# 3. Add the scripts below to scripts.yaml (or the `script:` section).
# 4. Developer tools > YAML > check configuration, then reload "Rest commands" and "Scripts" (no restart needed).
# 5. In the card: `source: service` (see README, "Multi-area mode").
#
# The scripts return the HTTP result ({status, content, headers}) to the caller, so the card can show errors the
# server reports (invalid place, quota reached, discovery still running) instead of guessing.

rest_command:
  area_events_list:
    url: "http://192.168.1.88:8765/api/v1/areas"
    method: get
    headers:
      authorization: !secret area_events_authorization
    timeout: 20
  area_events_ensure:
    url: "http://192.168.1.88:8765/api/v1/areas"
    method: post
    headers:
      authorization: !secret area_events_authorization
      content-type: application/json
    payload: "{{ spec | tojson }}"
    timeout: 60  # looking up a new city can take a few seconds
  area_events_get:
    url: "http://192.168.1.88:8765/api/v1/areas/{{ area_id }}"
    method: get
    headers:
      authorization: !secret area_events_authorization
    timeout: 20
  area_events_feed:
    url: "http://192.168.1.88:8765/api/v1/areas/{{ area_id }}/events"
    method: get
    headers:
      authorization: !secret area_events_authorization
    timeout: 30
  area_events_refresh:
    url: "http://192.168.1.88:8765/api/v1/areas/{{ area_id }}/refresh"
    method: post
    headers:
      authorization: !secret area_events_authorization
    timeout: 20

# --- scripts.yaml -----------------------------------------------------------------------------------------------
# (shown here as the `script:` section; paste the entries into scripts.yaml if you use !include)
script:
  area_events_list:
    alias: Area Events - list areas
    mode: parallel
    sequence:
      - action: rest_command.area_events_list
        response_variable: result
      - stop: Done
        response_variable: result

  area_events_ensure:
    alias: Area Events - choose an area
    mode: parallel
    fields:
      spec:
        description: "Place and radius, e.g. {latitude: 30.27, longitude: -97.74, radius_miles: 25, name: Austin}"
    sequence:
      - action: rest_command.area_events_ensure
        data:
          spec: "{{ spec }}"
        response_variable: result
      - stop: Done
        response_variable: result

  area_events_get:
    alias: Area Events - area status
    mode: parallel
    fields:
      area_id:
        description: The area id returned by area_events_ensure, or "default"
    sequence:
      - if: "{{ not (area_id | string | regex_match('^(default|a_[0-9a-f]{12})$')) }}"
        then:
          - stop: Invalid area id
            error: true
      - action: rest_command.area_events_get
        data:
          area_id: "{{ area_id }}"
        response_variable: result
      - stop: Done
        response_variable: result

  area_events_feed:
    alias: Area Events - area events
    mode: parallel
    fields:
      area_id:
        description: The area id returned by area_events_ensure, or "default"
    sequence:
      - if: "{{ not (area_id | string | regex_match('^(default|a_[0-9a-f]{12})$')) }}"
        then:
          - stop: Invalid area id
            error: true
      - action: rest_command.area_events_feed
        data:
          area_id: "{{ area_id }}"
        response_variable: result
      - stop: Done
        response_variable: result

  area_events_refresh:
    alias: Area Events - refresh an area
    mode: parallel
    fields:
      area_id:
        description: The area id returned by area_events_ensure
    sequence:
      - if: "{{ not (area_id | string | regex_match('^a_[0-9a-f]{12}$')) }}"
        then:
          - stop: Invalid area id
            error: true
      - action: rest_command.area_events_refresh
        data:
          area_id: "{{ area_id }}"
        response_variable: result
      - stop: Done
        response_variable: result
